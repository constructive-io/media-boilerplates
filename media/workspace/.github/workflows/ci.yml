name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Every script is a script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing is said or filmed here: that takes the engine and a voice. This reads every
    # script and says what is wrong with it, which needs nothing but Node and pnpm.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm lint
